[workspace]

[package]
name = "piscem"
version = "0.22.0"
edition = "2024"
build = "build.rs"
license = "BSD-3-Clause"
description = "Fast, space-efficient k-mer-based read mapper for bulk RNA-seq, scRNA-seq, and scATAC-seq"
repository = "https://github.com/COMBINE-lab/piscem"
homepage = "https://github.com/COMBINE-lab/piscem"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "rna-seq", "mapping", "kmer"]
categories = ["command-line-utilities", "science"]

[build-dependencies]
toml = "0.8"

[dependencies]
# `rapidgzip` is not a default feature of piscem-rs; without it the parallel
# gzip decoder is not compiled in and `--decoder` silently does nothing.
# `default-features = false` drops piscem-rs's `mimalloc` feature, which only
# installs a #[global_allocator] in piscem-rs's own binary — we install ours.
piscem-rs = { version = "0.9.1", default-features = false, features = [
  "rapidgzip",
] }
cf1-rs = "0.5.1"
anyhow = "1.0"
clap = { version = "4.6", features = ["cargo", "derive", "env", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = true, features = [
  "env-filter",
] }
prepare_fasta = { version = "0.2.0" }
serde_json = "1.0.149"
mimalloc = "0.1"

[profile.release]
lto = "thin"
opt-level = 3

# generated by 'cargo dist init'
[profile.dist]
inherits = "release"
