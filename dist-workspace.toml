[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
github-build-setup = "../build-setup.yml"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# CI backends to support
ci = "github"
# Whether to install an updater program
install-updater = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
## since this is cross-language and 
## we are not including C++ debug 
## symbols, this currently doesn't work 
## and would be of limited utility anyway.
# debug = true
# split-debuginfo = "packed"

[[dist.extra-artifacts]]
artifacts = ["source-full.tar.gz", "source-full.tar.gz.sha256"]
build = ["bash", "-c", """
  set -e
  git archive --format=tar.gz --prefix=piscem/ HEAD > source-full.tar.gz
  shasum -a 256 source-full.tar.gz > source-full.tar.gz.sha256
  """]

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-15-intel"

# macos-14 retires on 2026-11-02 (actions/runner-images#13518); build the
# Apple Silicon binary on macos-15. Its deployment target is unchanged
# (rustc's default for aarch64-apple-darwin, macOS 11).
[dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"

# Build the Linux binaries inside manylinux_2_28 containers (glibc 2.28), so
# they run on RHEL/Rocky 8, Debian 10, Ubuntu 18.10 and newer; built on the
# runners themselves they would need the runner's glibc (2.35+). glibc is
# linked dynamically, so a newer host's libc is used where present.
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

[dist.dependencies.homebrew]
coreutils = { stage = ["build"] }
gnu-tar = { stage = ["build"] }
